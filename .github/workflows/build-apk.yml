name: Build APK

on:
  push:
    branches: [main_claude, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStandardDebug assembleCompletaDebug --no-daemon
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk AlwaysMu-1.0.${{ github.run_number }}.apk
          cp app/build/outputs/apk/completa/debug/app-completa-debug.apk AlwaysMu-1.0.${{ github.run_number }}-completa.apk

      - name: Carica artefatto
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysMu-apk
          path: AlwaysMu-*.apk

      - name: Pubblica Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" AlwaysMu-*.apk \
            --target "${{ github.sha }}" \
            --title "AlwaysMu $TAG" \
            --notes "APK compilato automaticamente dal branch ${{ github.ref_name }} (commit ${{ github.sha }}). AlwaysMu-1.0.${{ github.run_number }}.apk = versione standard (consigliata, si installa senza blocchi di Play Protect). AlwaysMu-1.0.${{ github.run_number }}-completa.apk = con accesso alle notifiche: Play Protect può bloccarla." \
            --latest

name: Build APK

on:
  push:
    branches: [main_claude, main]
  workflow_dispatch:

permissions:
  contents: write

# Le esecuzioni che pubblicano vanno in fila: così la seconda vede la release della prima.
concurrency:
  group: alwaysmu-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test unitari
        run: |
          chmod +x gradlew
          ./gradlew testStandardDebugUnitTest --no-daemon

      - name: Compila APK
        run: |
          ./gradlew assembleStandardDebug assembleCompletaDebug --no-daemon
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk AlwaysMu-1.0.${{ github.run_number }}.apk
          cp app/build/outputs/apk/completa/debug/app-completa-debug.apk AlwaysMu-1.0.${{ github.run_number }}-completa.apk

      - name: Carica artefatto
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysMu-apk
          path: AlwaysMu-*.apk

      - name: Pubblica Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Una sola release per commit: lo stesso commit spinto su main_claude e su main
          # (o rilanciato a mano) non crea un duplicato.
          EXISTING=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
            --jq '.[] | select(.target_commitish == "${{ github.sha }}") | .tag_name' | head -1)
          if [ -n "$EXISTING" ]; then
            echo "::notice::Il commit ${{ github.sha }} è già pubblicato come $EXISTING: nessuna nuova release."
            exit 0
          fi
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" AlwaysMu-*.apk \
            --target "${{ github.sha }}" \
            --title "AlwaysMu $TAG" \
            --notes "APK compilato automaticamente dal branch ${{ github.ref_name }} (commit ${{ github.sha }}). AlwaysMu-1.0.${{ github.run_number }}.apk = versione standard (consigliata, si installa senza blocchi di Play Protect). AlwaysMu-1.0.${{ github.run_number }}-completa.apk = con accesso alle notifiche: Play Protect può bloccarla." \
            --latest
